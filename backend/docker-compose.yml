version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gridvault-postgres
    environment:
      POSTGRES_DB: gridvault
      POSTGRES_USER: gridvault_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-sql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridvault_user -d gridvault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
