[project]
name = "gridvault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "privat@felixhenneri.ch", email = "privat@felixhenneri.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
gridvault = "gridvault.main:main"

[tool.fastapi]
entrypoint = "gridvault.main:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
